<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestell App</title>

    <link rel="shortcut icon" href="assets/icons/favicon.svg" type="image/x-icon">

    <link rel="stylesheet" href="styles/variables.css">
    <link rel="stylesheet" href="styles/fonts.css">
    <link rel="stylesheet" href="styles/standard.css">
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/hero.css">
    <link rel="stylesheet" href="styles/meals.css">
    <link rel="stylesheet" href="styles/menu_bar.css">
    <link rel="stylesheet" href="styles/basket.css">
    <link rel="stylesheet" href="styles/scrollbar.css">

    <script src="scripts/db.js"></script>
    <script src="scripts/utils.js"></script>
    <script src="scripts/templates.js"></script>
    <script src="scripts/store.js"></script>
</head>

<body onload="initialize()">
    <header class="page_header">
        <img src="assets/icons/logo.svg"
            alt="Eine Tüte mit einer Gabel darauf. Daneben der Text Bestell APP; beide Wörter untereinander positioniert.">
        <menu class="burger_menu">
            <img src="assets/icons/burger_menu.svg" alt="Drei Balken übereinander positioniert.">
        </menu>
    </header>

    <main>
        <section class="hero_section">
            <div class="hero_image_wrapper">
                <img src="./assets/img/burger_house_logo.png" alt="Ein gezeichneter Burger." class="burger_house_logo">
            </div>
            <div class="hero_text_wrapper">
                <div class="hero_headline">
                    <h1><span>Burger</span>House</h1>
                    <div class="ratings_wrapper">
                        <img src="./assets/icons/star.svg" alt="Ein schwarzer Stern." class="ratings_star_img">
                        <p class="ratings_grade_text">4,1</p>
                        <p class="ratings_total_count_text">(317)</p>
                    </div>
                </div>
                <p>The best of Burgers, Pizza, and Greens, all in one great place.</p>
            </div>
        </section>

        <section class="meal_categories_and_basket_wrapper">
            <div id="mealCategoriesSection">
            </div>

            <div class="basket_wrapper">
                <div class="basket">
                    <div class="basket_content_wrapper">
                        <header>
                            <h2 class="basket_heading">Your Basket</h2>
                        </header>

                        <div id="basketProductCardsWrapper">
                        </div>

                        <div class="basket_amounts">
                            <div class="basket_amount_wrapper">
                                <p>Subtotal</p>
                                <p id="subtotalText">x,y€</p>
                            </div>
                            <div class="basket_amount_wrapper">
                                <p>Delivery fee</p>
                                <p id="deliveryFeeText">x,y€</p>
                            </div>
                            <hr>
                            <div class="basket_amount_wrapper">
                                <p>Total</p>
                                <p id="totalText">x,y€</p>
                            </div>
                        </div>

                        <button id="basketPayButton">Buy now (x,y€)</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <menu class="mobile_menu_bar">
        <ul>
            <li>
                <a href="./index.html">
                    <img src="./assets/icons/home.svg" alt="A house.">
                </a>

            </li>
            <li>
                <a href="./index.html">
                    <img src="./assets/icons/person.svg" alt="A silhouette of a person.">
                </a>
            </li>
            <li>
                <a href="./index.html">
                    <img src="./assets/icons/favicon.svg" alt="A paper bag with a fork on it.">
                </a>
            </li>
            <li>
                <a href="./index.html">
                    <img src="./assets/icons/shopping_cart.svg" alt="A shopping cart.">
                </a>
            </li>
        </ul>
    </menu>

    <footer class="page_footer">
        <div class="page_footer_infos">
            <p>© 2026 BurgerHouse</p>
            <p>Imprint</p>
            <p>Cookie Preferences</p>
        </div>
    </footer>
</body>

</html>
